<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="820" viewBox="0 0 1800 820">
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#4b5563"/>
    </marker>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#f8d45a"/>
      <stop offset="0.5" stop-color="#f2a900"/>
      <stop offset="1" stop-color="#c88500"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" x2="1">
      <stop offset="0" stop-color="#41d6d0"/>
      <stop offset="1" stop-color="#bb65f2"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 34px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #111827; }
      .stage { font: 700 25px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #0f766e; }
      .label { font: 600 22px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #1f2937; }
      .small { font: 500 18px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #4b5563; }
      .tiny { font: 500 15px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #4b5563; }
      .card { fill: #ffffff; stroke: #d1d5db; stroke-width: 2; rx: 18; filter: url(#softShadow); }
      .arrow { stroke: #4b5563; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #6b7280; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1800" height="820" fill="#ffffff"/>
  <text x="90" y="76" class="title">实验样品制备流程图</text>
  <text x="90" y="112" class="small">4H-Au纳米线模板诱导1T′-TMD壳层生长，并制备柔性SERS检测胶带</text>

  <!-- Stage headers -->
  <text x="120" y="178" class="stage">4H-Au纳米线制备</text>
  <text x="555" y="178" class="stage">1T′-TMD壳层生长</text>
  <text x="1045" y="178" class="stage">产物后处理</text>
  <text x="1395" y="178" class="stage">SERS胶带制备</text>

  <!-- Cards -->
  <rect x="90" y="205" width="330" height="430" class="card"/>
  <rect x="510" y="205" width="410" height="430" class="card"/>
  <rect x="1010" y="205" width="300" height="430" class="card"/>
  <rect x="1390" y="205" width="320" height="430" class="card"/>

  <!-- Card 1: flask and Au NW -->
  <g transform="translate(130,240)">
    <path d="M95 60 L95 158 Q95 192 62 222 L168 222 Q135 192 135 158 L135 60 Z" fill="#eef2ff" stroke="#64748b" stroke-width="4"/>
    <path d="M85 60 L145 60" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
    <path d="M76 162 Q115 140 154 162 L170 214 L60 214 Z" fill="#fef3c7" stroke="none" opacity="0.95"/>
    <circle cx="98" cy="185" r="8" fill="#f59e0b" opacity="0.7"/>
    <circle cx="128" cy="170" r="6" fill="#fbbf24" opacity="0.75"/>
    <circle cx="145" cy="197" r="5" fill="#f59e0b" opacity="0.6"/>
    <text x="115" y="260" text-anchor="middle" class="label">Au前驱体混合</text>
    <text x="115" y="294" text-anchor="middle" class="small">57 °C反应48 h</text>

    <g transform="translate(45,330)">
      <ellipse cx="62" cy="20" rx="92" ry="12" fill="#e5e7eb"/>
      <path d="M0 16 C40 0 84 6 130 22" stroke="url(#gold)" stroke-width="17" stroke-linecap="round" fill="none"/>
      <path d="M0 16 C40 0 84 6 130 22" stroke="#fff7cc" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.8"/>
    </g>
    <text x="115" y="395" text-anchor="middle" class="label">4H-Au纳米线</text>
    <text x="115" y="425" text-anchor="middle" class="small">离心洗涤</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M430 420 C460 420 475 420 500 420" class="arrow"/>

  <!-- Card 2: shell growth reactor -->
  <g transform="translate(545,240)">
    <rect x="38" y="40" width="280" height="210" rx="28" fill="#f8fafc" stroke="#94a3b8" stroke-width="4"/>
    <path d="M72 88 C130 62 216 60 284 90" stroke="#2dd4bf" stroke-width="6" fill="none"/>
    <path d="M74 132 C132 106 216 106 282 134" stroke="#c084fc" stroke-width="6" fill="none"/>
    <path d="M74 178 C132 152 216 152 282 180" stroke="#f59e0b" stroke-width="6" fill="none"/>
    <circle cx="110" cy="112" r="9" fill="#2dd4bf"/>
    <circle cx="245" cy="148" r="9" fill="#c084fc"/>
    <circle cx="190" cy="190" r="9" fill="#f59e0b"/>
    <text x="178" y="292" text-anchor="middle" class="label">S/Se源脱气</text>
    <text x="178" y="326" text-anchor="middle" class="small">Ar气氛290 °C</text>
    <text x="178" y="360" text-anchor="middle" class="small">注入Au与W/Mo前驱体</text>
    <text x="178" y="394" text-anchor="middle" class="small">反应3 min</text>

    <g transform="translate(70,415)">
      <path d="M0 16 C56 0 118 5 196 24" stroke="url(#shell)" stroke-width="27" stroke-linecap="round" fill="none"/>
      <path d="M0 16 C56 0 118 5 196 24" stroke="url(#gold)" stroke-width="14" stroke-linecap="round" fill="none"/>
      <path d="M0 16 C56 0 118 5 196 24" stroke="#fff7cc" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.75"/>
    </g>
    <text x="178" y="485" text-anchor="middle" class="label">1T′-TMD壳层生长</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M930 420 C965 420 980 420 1002 420" class="arrow"/>

  <!-- Card 3: post-treatment -->
  <g transform="translate(1035,242)">
    <g transform="translate(55,35)">
      <rect x="0" y="0" width="160" height="95" rx="12" fill="#e0f2fe" stroke="#60a5fa" stroke-width="3"/>
      <path d="M20 58 Q80 25 140 58 L140 84 L20 84 Z" fill="#bfdbfe"/>
      <text x="80" y="128" text-anchor="middle" class="label">乙醇/盐酸处理</text>
    </g>
    <g transform="translate(65,205)">
      <circle cx="72" cy="72" r="62" fill="#f9fafb" stroke="#9ca3af" stroke-width="4"/>
      <path d="M34 72 A38 38 0 1 0 110 72" stroke="#0f766e" stroke-width="9" fill="none" stroke-linecap="round"/>
      <path d="M108 72 L126 58 L126 86 Z" fill="#0f766e"/>
      <text x="72" y="166" text-anchor="middle" class="label">离心分散</text>
    </g>
    <g transform="translate(35,405)">
      <path d="M0 18 C54 0 120 6 210 26" stroke="url(#shell)" stroke-width="25" stroke-linecap="round" fill="none"/>
      <path d="M0 18 C54 0 120 6 210 26" stroke="url(#gold)" stroke-width="13" stroke-linecap="round" fill="none"/>
      <text x="108" y="78" text-anchor="middle" class="label">4H-Au@1T′-TMD</text>
      <text x="108" y="106" text-anchor="middle" class="small">核壳纳米线</text>
    </g>
  </g>

  <!-- Arrow 3 -->
  <path d="M1320 420 C1350 420 1365 420 1382 420" class="arrow"/>

  <!-- Card 4: flexible tape -->
  <g transform="translate(1415,240)">
    <g transform="translate(18,45)">
      <path d="M22 140 L238 94 L270 154 L54 200 Z" fill="#f3f4f6" stroke="#9ca3af" stroke-width="3"/>
      <path d="M30 130 L246 84 L238 94 L22 140 Z" fill="#d1d5db" opacity="0.9"/>
      <path d="M52 119 L245 78" stroke="#bfdbfe" stroke-width="10" opacity="0.9"/>
      <text x="145" y="240" text-anchor="middle" class="label">PDMS基底</text>
      <text x="145" y="272" text-anchor="middle" class="small">溅射50 nm SiO2</text>
    </g>
    <g transform="translate(38,280)">
      <path d="M5 30 C55 8 115 15 205 42" stroke="url(#shell)" stroke-width="18" stroke-linecap="round" fill="none"/>
      <path d="M5 30 C55 8 115 15 205 42" stroke="url(#gold)" stroke-width="9" stroke-linecap="round" fill="none"/>
      <path d="M25 82 C84 56 142 66 226 92" stroke="url(#shell)" stroke-width="18" stroke-linecap="round" fill="none"/>
      <path d="M25 82 C84 56 142 66 226 92" stroke="url(#gold)" stroke-width="9" stroke-linecap="round" fill="none"/>
    </g>
    <text x="160" y="420" text-anchor="middle" class="label">滴加纳米线分散液</text>
    <text x="160" y="455" text-anchor="middle" class="small">60 °C干燥30 min</text>
    <text x="160" y="510" text-anchor="middle" class="label">柔性SERS检测胶带</text>
  </g>

  <!-- Bottom key -->
  <g transform="translate(90,700)">
    <rect x="0" y="0" width="1620" height="62" rx="16" fill="#f9fafb" stroke="#e5e7eb"/>
    <circle cx="38" cy="31" r="11" fill="url(#gold)"/>
    <text x="58" y="38" class="small">Au核心</text>
    <circle cx="165" cy="31" r="11" fill="#2dd4bf"/>
    <circle cx="190" cy="31" r="11" fill="#c084fc"/>
    <text x="212" y="38" class="small">TMD壳层（S/Se，W/Mo）</text>
    <rect x="452" y="19" width="44" height="24" rx="6" fill="#e5e7eb" stroke="#9ca3af"/>
    <text x="512" y="38" class="small">PDMS/SiO2基底</text>
    <text x="1180" y="38" class="tiny">注：未加入文中未明确说明的FIB、离子减薄或电镜网格制样步骤</text>
  </g>
</svg>
